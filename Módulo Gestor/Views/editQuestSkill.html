{% extends 'base.html' %}
{% block content %}

    <!-- Editar habilidade questão -->
        <div class="container mt-5">
            <div class="row d-flex justify-content-center">
                <!-- Formulário -->
                    <div class="col-md-8 border border-3" style="border-color: #bcbcbc;border-radius: 20px; height: 700px;">
                        <div class="fw-bold text-center mt-5" style="font-size: 25px;">Editar Habilidade da Questão</div>
                        <div class="container d-flex justify-content-center">
                            <form action="{{url_for('updateQskill',id=qskill.id)}}" method="post" class="row mt-4" style="width: 75%;">
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Questão:</label>
                                    <select class="form-select" name="question">
                                        {% for question in questions %}
                                        <option value="{{question.id}}"
                                            {% if question.id == qskill.idQuestion %} selected {% endif %}>
                                            {{ question.question[:65] }}{% if question.question|length > 65 %}...{% endif %}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Habilidade:</label>
                                    <select class="form-select" name="skill">
                                        {% for skill in skills %}
                                        <option value="{{skill.id}}"
                                            {% if   skill.id == qskill.idSkill %} selected {% endif %}>
                                            {{skill.skill}}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Ano/Serie:</label>
                                    <select class="form-select" name="yearSerie">
                                        {% for ys in yearsSeries %}
                                        <option value="{{ys.id}}"
                                            {% if ys.id == qskill.idYearSerie %} selected {% endif %}>
                                            {{ys.year}} - {{ys.serie}}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Dificuldade:</label>
                                    <select class="form-select" name="difficulty">
                                    <option value="1"{% if qskill.difficulty == 1 %} selected {% endif %}>
                                        Fácil</option>
                                    <option value="2"{% if qskill.difficulty == 2 %} selected {% endif %}>
                                        Médio</option>
                                    <option value="3"{% if qskill.difficulty == 3 %} selected {% endif %}>
                                        Difícil</option>
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Disponível para Respostas:</label>
                                    <input type="checkbox" class="form-check-input border border-2 border-dark ms-1" name="available"
                                    {% if qskill.available %} checked {% endif %}>
                                </div>
                                <div class="d-flex justify-content-center">
                                    <input type="submit" value="Editar" class="mt-5 btn text-white fw-bold" style="background-color: #5491C7; width: 190px;">
                                </div>
                            </form>
                        </div>
                    </div>
                <!-- Fim formulário -->
            </div>
        </div>
    <!-- Fim editar habilidade questão -->

{% endblock content %}
