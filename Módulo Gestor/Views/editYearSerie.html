{% extends 'base.html' %}
{% block content %}

      <!-- Editar ano/serie -->
      <div class="container mt-5">
        <div class="row d-flex justify-content-center">
            <!-- Formulário -->
            <div class="col-md-8 border border-3" style="border-color: #bcbcbc; border-radius: 20px; height: 700px;">
                <div class="fw-bold text-center mt-5" style="font-size: 25px;">Editar Ano/Serie</div>
                <div class="container d-flex justify-content-center">
                    <form action="{{url_for('updateYearSerie', id=yearSerie.id)}}" method="post" class="row mt-4" style="width: 75%;">
                        <div class="mt-3">
                            <label class="form-label fw-bold">Ano</label>
                            <input type="number" name="year" class="form-control" value="{{yearSerie.year}}"/>
                        </div>
                                                <div class="mt-3">
                            <label class="form-label fw-bold">Serie</label>
                            <input type="text" name="serie" class="form-control" value="{{yearSerie.serie}}"/>
                        </div>
                                                <div class="mt-3">
                            <label class="form-label fw-bold">Descrição</label>
                            <input type="text" name="descryption" class="form-control" value="{{yearSerie.descryption}}"/>
                        </div>
                        <div class="d-flex justify-content-center">
                            <input type="submit" value="Editar" class="mt-5 btn text-white fw-bold" style="background-color: #5491C7; width: 190px;">
                        </div>
                    </form>
                </div>
            </div>
            <!-- Fim formulário -->
        </div>
    </div>
<!-- Fim editar ano/serie -->

{% endblock content %}
