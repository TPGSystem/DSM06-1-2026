{% extends 'base.html' %}
{% block content %}

<div class="container mt-5 min-vh-100">
    <div class="row">
        <table class="table table-hover table-striped-columns">
            <thead>
                <tr>
                  <th scope="col">Componente</th>
                  <th scope="col">Habilidade</th>
                  <th scope="col">Descrição</th>
                  <th scope="col">Código CP</th>
                  <th scope="col">Código BNCC</th>
                  <th scope="col">Ações</th>
                </tr>
              </thead>
              <tbody>
                {% for skill in skills %}
                <tr>
                  <td hidden>{{skill.id}}</td>
                  <th scope="row">{{skill.idComponent}}</th>
                  <td>{{skill.skill}}</td>
                  <td>{{skill.comment}}</td>
                  <td>{{skill.skillCodeCP}}</td>
                  <td>{{skill.skillCodeBNCC}}</td>
                  <td colspan="2">
                    <a href="{{url_for('editSkill', id=skill.id)}}" class="btn" style="background-color: #5491C7;"><img src="../static/imgs/Vector(3).png" alt="Editar" style="width: 22px; height: 20px;"></a>
                    <a href="{{url_for('dSkill', id=skill.id)}}" class="btn" style="background-color: #FE4D4D;"><img src="../static/imgs/Vector(4).png" alt="Deletar" style="width: 22px; height: 20px;"></a>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
        </table>
    </div>
</div>

{% endblock content %}
