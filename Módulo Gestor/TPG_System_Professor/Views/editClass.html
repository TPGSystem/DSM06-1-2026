{% extends 'base.html' %}
{% block content %}

      <!-- Editar turma -->
      <div class="container mt-5">
        <div class="row d-flex justify-content-center">
            <!-- Formulário -->
            <div class="col-md-8 border border-3" style="border-color: #bcbcbc; border-radius: 20px; height: 650px;">
                <div class="fw-bold text-center mt-5" style="font-size: 25px;">Cadastro de Classe</div>
                <div class="container d-flex justify-content-center">
                    <form action="{{url_for('updateclass',id=classS.id)}}" method="post" class="row mt-4" style="width: 75%;">
                        <div class="mt-3">
                            <label class="form-label fw-bold">Ano de Registro:</label>
                            <input type="number" name="yearRegist" class="form-control" value="{{classS.schoolYear}}"/>
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-bold">Ano/Serie:</label>
                            <select class="form-select" name="name">
                                {% for ys in yearsSeries %}
                                    <option value="{{ ys.id }}"
                                        {% if ys.id == classS.idYearSerie %} selected {% endif %}>
                                        {{ ys.year }} - {{ ys.serie }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-bold">Componente:</label>
                            <select class="form-select" name="component">
                                {% for comp in components %}
                                    <option value="{{ comp.id }}"
                                        {% if comp.id == classS.idComponent %} selected {% endif %}>
                                        {{ comp.descryption }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-bold">Professor:</label>
                            <input type="text" class="form-control" value="{{ session.teacher_name }}" disabled>
                        </div>
                        <div class="d-flex justify-content-center">
                            <input type="submit" value="Editar" class="mt-5 btn text-white fw-bold" style="background-color: #5491C7; width: 190px;">
                        </div>
                    </form>
                </div>
            </div>
            <!-- Fim formulário -->
        </div>
    </div>
<!-- Fim editar turma -->

{% endblock content %}
