{% extends 'base.html' %}
{% block content %}

    <!-- Cadastro habilidade questão -->
        <div class="container mt-5">
            <div class="row d-flex justify-content-center">
                <!-- Formulário -->
                    <div class="col-md-8 border border-3" style="border-color: #bcbcbc;border-radius: 20px; height: 700px;">
                        <div class="fw-bold text-center mt-5" style="font-size: 25px;">Cadastro de Habilidade da Questão</div>
                        <div class="container d-flex justify-content-center">
                            <form action="{{url_for('cadQskill')}}" method="post" class="row mt-4" style="width: 75%;">
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Questão:</label>
                                    <select class="form-select" name="question">
                                        <option selected>Selecione uma Questão</option>
                                        {% for question in questions %}
                                        <option value="{{question.id}}">
                                            {{ question.question[:65] }}{% if question.question|length > 65 %}...{% endif %}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Habilidade:</label>
                                    <select class="form-select" name="skill">
                                        <option selected>Selecione uma Habilidade</option>
                                        {% for skill in skills %}
                                        <option value="{{skill.id}}">
                                            {{skill.skill}}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Ano/Serie:</label>
                                    <select class="form-select" name="yearSerie">
                                        <option selected>Seleciona um Ano/Serie</option>
                                        {% for ys in yearsSeries %}
                                        <option value="{{ys.id}}">
                                            {{ys.year}} - {{ys.serie}}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Dificuldade:</label>
                                    <select class="form-select" name="difficulty">
                                    <option selected>Selecione a Dificuldade</option>
                                    <option value="1">Fácil</option>
                                    <option value="2">Médio</option>
                                    <option value="3">Difícil</option>
                                    </select>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Disponível para Respostas:</label>
                                    <input type="checkbox" class="form-check-input border border-2 border-dark ms-1" name="available">
                                </div>
                                <div class="d-flex justify-content-center">
                                    <input type="submit" value="Cadastrar" class="mt-5 btn text-white fw-bold" style="background-color: #5491C7; width: 190px;">
                                </div>
                            </form>
                        </div>
                    </div>
                <!-- Fim formulário -->
            </div>
        </div>
    <!-- Fim cadastro habilidade questão -->

{% endblock content %}
