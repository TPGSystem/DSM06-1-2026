{% extends 'base.html' %}
{% block content %}

      <!-- Cadastro de habilidade -->
      <div class="container mt-5">
        <div class="row d-flex justify-content-center">
            <!-- Formulário -->
            <div class="col-md-8 border border-3" style="border-color: #bcbcbc; border-radius: 20px; height: 700px;">
                <div class="fw-bold text-center mt-5" style="font-size: 25px;">Cadastro de Habilidade</div>
                <div class="container d-flex justify-content-center">
                    <form action="{{url_for('cadSkill')}}" method="post" class="row mt-4" style="width: 75%;">
                        <div class="mt-3">
                            <label class="form-label fw-bold">Classe:</label>
                            <select class="form-select" name="component">
                                <option selected>Selecione um Componente</option>
                                {% for component in components %}
                                    <option value="{{component.id}}">
                                        {{component.descryption}}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-bold">Habilidade</label>
                            <input type="text" name="skill" class="form-control" placeholder="Digite a habilidade"/>
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-bold">Descrição</label>
                            <input type="text" name="comment" class="form-control" placeholder="Digite a descrição"/>
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-bold">Código CP:</label>
                            <input type="text" name="codeCP" class="form-control" placeholder="Digite o código CP da habilidade">
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-bold">Código BNCC:</label>
                            <input type="text" name="codeBNCC" class="form-control" placeholder="Digite o código BNCC da habilidade">
                        </div>
                        <div class="d-flex justify-content-center">
                            <input type="submit" value="Cadastrar" class="mt-5 btn text-white fw-bold" style="background-color: #5491C7; width: 190px;">
                        </div>
                    </form>
                </div>
            </div>
            <!-- Fim formulário -->
        </div>
    </div>
<!-- Fim cadastro de habilidade -->

{% endblock content %}
